# Image Restoration Interaction Configuration for verl multi-turn RL training
#
# This interaction calculates rewards by comparing degraded and restored images
# using IQA metrics (QAlign, MANIQA, MUSIQ, CLIPIQA, NIQE).
#
# Usage:
#   actor_rollout_ref:
#     rollout:
#       multi_turn:
#         interaction_config_path: path/to/restoration_interaction_config.yaml

interaction:
  - name: "image_restoration"
    class_name: "verl.interactions.image_restoration_interaction.ImageRestorationInteraction"
    config:
      # Maximum number of restoration iterations
      max_iterations: 5
      
      # Whether to use IQA (Image Quality Assessment) metrics for scoring
      # Uses QAlign, MANIQA, MUSIQ, CLIPIQA, NIQE with degradation-type-specific weights
      use_iqa: true
      
      # Device for IQA scoring (use cuda:3 to avoid conflict with SGLang and restoration models)
      device: cuda:3
      
      # Scale factor for final reward
      # Adjusts the magnitude of rewards for RL training
      reward_scale: 10.0
