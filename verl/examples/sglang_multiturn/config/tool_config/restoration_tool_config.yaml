# Image Restoration Tool Configuration for verl multi-turn rollout
#
# This tool provides image restoration capabilities including:
# - Super-resolution (real_esrgan)
# - Denoising (scunet)
# - Low-light enhancement (retinexformer_fivek, hvicidnet, lightdiff)
# - Deraining (turbo_rain, s2former, idt)
# - Dehazing (ridcp, kanet)
# - Desnowing (turbo_snow)
#
# GPU Memory Management Strategy:
#   To avoid conflicts with SGLang's memory_saver (which causes resume_memory_occupation timeout),
#   we use dynamic model loading with auto_unload:
#   - preload=False: Don't load all models at init, load on-demand
#   - auto_unload=True: Unload model after each use to free GPU memory
#   This allows SGLang to reclaim memory when it needs to sync weights.
#
# Usage:
#   actor_rollout_ref:
#     rollout:
#       tool_kwargs:
#         tools_config_file: path/to/restoration_tool_config.yaml

tools:
  - class_name: "verl.tools.restoration_tool.RestorationTool"
    config:
      type: native
      # Device for running restoration models
      # Use cuda:3 as dedicated GPU for restoration (SGLang uses GPU 0-2)
      # Alternatively use cuda:0 with auto_unload=True
      device: cuda:3
      # Directory for intermediate output images
      output_dir: /tmp/verl_restoration
      # Dynamic loading mode to avoid GPU memory conflicts with SGLang
      # preload=False: Load models on-demand instead of at initialization
      preload: false
      # auto_unload=True: Automatically unload model after each use
      # This frees GPU memory so SGLang can resume_memory_occupation
      auto_unload: true
    tool_schema:
      type: "function"
      function:
        name: "restore_image"
        description: |
          Apply an image restoration operation to remove degradation. 
          Available restoration actions:
          - real_esrgan: Super-resolution, deblurring, denoising, compression artifact removal
          - scunet: High-quality image denoising
          - retinexformer_fivek: Low-light image enhancement
          - hvicidnet: Low-light and exposure correction
          - lightdiff: Low-light enhancement using diffusion model
          - turbo_rain: Fast deraining
          - s2former: Rain streak removal
          - idt: Deraining and raindrop removal
          - ridcp: Image dehazing
          - kanet: Image dehazing
          - turbo_snow: Image desnowing
          - stop: Stop the restoration process (use when image is sufficiently restored)
          
          Choose the most appropriate action based on the observed degradation type.
        parameters:
          type: "object"
          properties:
            action:
              type: "string"
              description: |
                The restoration action to apply. Must be one of:
                real_esrgan, scunet, retinexformer_fivek, hvicidnet, lightdiff,
                turbo_rain, s2former, idt, ridcp, kanet, turbo_snow, snowmaster, stop
              enum:
                - real_esrgan
                - scunet
                - retinexformer_fivek
                - hvicidnet
                - lightdiff
                - turbo_rain
                - s2former
                - idt
                - ridcp
                - kanet
                - turbo_snow
                - snowmaster
                - stop
          required:
            - action
